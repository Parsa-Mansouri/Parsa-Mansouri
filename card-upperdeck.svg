<text x="30" y="122" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#8A99B8">Digital menu and website for an American diner in Besiktas,</text><text x="30" y="145" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#8A99B8">Istanbul. Kagu also runs the paid social on Meta and TikTok,</text><text x="30" y="168" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#8A99B8">so the site is measured on walk-ins and orders, not on</text><text x="30" y="191" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#8A99B8">how it looks in a portfolio.</text>
