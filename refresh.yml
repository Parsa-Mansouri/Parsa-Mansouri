name: Refresh profile graphics

on:
  schedule:
    - cron: "17 4 * * *"   # every day at 04:17 UTC
  workflow_dispatch:        # or whenever I press the button
  push:
    branches: [main]
    paths: ["build.py", "refresh.py"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull the live contribution calendar and rebuild every SVG
        run: python3 refresh.py

      - name: Commit if anything moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json *.svg
          if git diff --staged --quiet; then
            echo "nothing changed today"
          else
            git commit -m "Refresh contribution graphics"
            git push
          fi
