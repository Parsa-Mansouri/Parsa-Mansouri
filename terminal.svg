<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="368" viewBox="0 0 1200 368" role="img" aria-label="A build and deploy from a normal day">
<defs>
<linearGradient id="tm-bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#040913"/><stop offset="1" stop-color="#060D1B"/></linearGradient>
<clipPath id="tm-clip"><rect width="1200" height="368" rx="16"/></clipPath>
<linearGradient id="tm-sweep" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
<stop offset="0.5" stop-color="#ffffff" stop-opacity="0.055"/>
<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
</defs>
<rect width="1200" height="368" rx="16" fill="url(#tm-bg)"/>
<g clip-path="url(#tm-clip)">
<g transform="translate(-1200 0)">
<rect x="0" y="-368" width="150" height="1104" fill="url(#tm-sweep)" transform="rotate(18)"/>
<animateTransform attributeName="transform" type="translate" from="-720.0 0" to="1680.0 0"
 dur="10s" begin="1.5s" repeatCount="indefinite"/>
</g></g>
<rect x="0" y="0" width="1200" height="52" fill="#0B1730" clip-path="url(#tm-clip)"/>
<line x1="0" y1="52" x2="1200" y2="52" stroke="#1C2B4A"/>
<circle cx="30" cy="26" r="6" fill="#FF5F57"/><circle cx="52" cy="26" r="6" fill="#FFC46B"/><circle cx="74" cy="26" r="6" fill="#3DDC97"/>
<text x="600.0" y="31" text-anchor="middle" font-family="'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1.5" fill="#8A99B8">parsa@kagu  /  a normal tuesday</text>
<text x="38" y="86" font-family="'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5" fill="#5C6C8C">&#35; four products in flight, one stack, zero drama</text>
<g opacity="0">
<text x="38" y="118" font-family="'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5" fill="#3D7BFF">$</text>
<text x="60" y="118" font-family="'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5" fill="#F2F5FA">pnpm turbo build --filter=...[origin/main]</text>
<animate attributeName="opacity" from="0" to="1" dur="0.28s" begin="0.50s" fill="freeze"/></g><g opacity="0">
<text x="60" y="143" font-family="'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#8A99B8">web:booking   built in 12.4s</text>
<animate attributeName="opacity" from="0" to="1" dur="0.28s" begin="0.84s" fill="freeze"/></g><g opacity="0">
<text x="60" y="168" font-family="'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#8A99B8">web:site      built in  9.1s</text>
<animate attributeName="opacity" from="0" to="1" dur="0.28s" begin="1.18s" fill="freeze"/></g><g opacity="0">
<text x="60" y="193" font-family="'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#8A99B8">desktop:ops   built in 18.7s</text>
<animate attributeName="opacity" from="0" to="1" dur="0.28s" begin="1.52s" fill="freeze"/></g><g opacity="0">
<text x="60" y="218" font-family="'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#3DDC97">&#10003; 3 packages, 0 errors, 0 type errors</text>
<animate attributeName="opacity" from="0" to="1" dur="0.28s" begin="1.86s" fill="freeze"/></g><g opacity="0">
<text x="38" y="243" font-family="'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5" fill="#3D7BFF">$</text>
<text x="60" y="243" font-family="'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5" fill="#F2F5FA">pnpm test &amp;&amp; vercel deploy --prod</text>
<animate attributeName="opacity" from="0" to="1" dur="0.28s" begin="2.20s" fill="freeze"/></g><g opacity="0">
<text x="60" y="268" font-family="'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#3DDC97">&#10003; tests passed, deployed to production</text>
<animate attributeName="opacity" from="0" to="1" dur="0.28s" begin="2.54s" fill="freeze"/></g><g opacity="0">
<text x="38" y="293" font-family="'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5" fill="#3D7BFF">$</text>
<text x="60" y="293" font-family="'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.5" fill="#F2F5FA">git log --oneline -1</text>
<animate attributeName="opacity" from="0" to="1" dur="0.28s" begin="2.88s" fill="freeze"/></g><g opacity="0">
<text x="60" y="318" font-family="'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#8A99B8">feat(ops): offline-first till, EN/AR, full RTL</text>
<animate attributeName="opacity" from="0" to="1" dur="0.28s" begin="3.22s" fill="freeze"/></g>
<rect x="60" y="329" width="9" height="17" fill="#3D7BFF" opacity="0">
<animate attributeName="opacity" values="0;1" dur="0.1s" begin="3.56s" fill="freeze"/>
<animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" begin="3.66s" repeatCount="indefinite"/></rect>
<rect x="0.5" y="0.5" width="1199" height="367" rx="16" fill="none" stroke="#1C2B4A"/>
</svg>
